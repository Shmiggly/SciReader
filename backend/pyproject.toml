[project]
name = "scireader"
version = "0.1.0"
description = "Open-source, local-first, science-aware reading companion for scientific papers"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "httpx>=0.27",
    "docling>=2.40",
    "pypdfium2>=4.30",
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    "en_core_web_sm",
    "torch>=2.6",
    "torchvision",
    "soundfile>=0.12",
    "numpy>=1.26",
    "huggingface_hub>=0.25",
]

[dependency-groups]
bench = [
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
scireader = "scireader.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scireader"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
